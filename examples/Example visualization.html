<!-- Page setup and title -->
<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Type" content="text/html;
charset=UTF-8">
<title>My first simulation</title>
<style type="text/css"> 
body{
    font-family: "HelveticaNeue-Light", sans-serif; padding : 15px;
}
</style>

<!-- Sourcing the cpm build -->
<script src="./Build/artistoo.js"></script>
<script src="./fpsmeter.min.js"></script>
<script>
"use strict"

let config = {              //object parsed to CPM class (config = constructor of class Simulation)
    // Grid settings
	ndim : 2,               //number of dimension
	field_size : [100, 100],   //number of pixels in each dimension
	
    //CPM parameters and configuration
    conf : {
        T : 20,             // temperature CPM model
        seed : 2,
        torus : [true, true],

        // Adhesion parameters:
        J: [[0,20,0], [20, 100, 30], [0, 30, 0]],

        // Volume constraint parameters:
        LAMBDA_V : [0, 50, 100],  // VolumeConstraint importance per cellkind
        V : [0, 500, 500],        // Target volume for each cellkind
        
        // Perimeter constraint parameters:
        LAMBDA_P : [0, 5, 5],
        P : [0, 260, 300],

        // Activity constraint parameters:
        MAX_ACT : [0, 50, 0],
        LAMBDA_ACT : [0, 500, 0],
        ACT_MEAN : "geometric"
	},

    // Simulation setup and configuration
	simsettings : {         
        NRCELLS : [1, 3],                               //Number of cells to seed for all non-background cells
        RUNTIME : 500,                                  //node only
        RUNTIME_BROWSER : "Inf",
        CANVASCOLOR : "eaecef",                         //background color
        ACTCOLOR : [true, false],
        CELLCOLOR : ['000000', 'FFFFFF'],               // Cell color, does not need background colour (black, white)
        SHOWBORDERS : [true, true],                     //cell border True / false
        BORDERCOL : ['0000FF', 'FF0000'],               //cell border color, requires SHOWBORDERS : TRUE (Blue, Red)
        zoom : 5,                                       //zoom in on canvas
        IMGFRAMERATE : 1                                //framerate of what is shown on the canvas
	}
}


let sim, meter
function initialize(){
    sim = new CPM.Simulation(config)                 //initialize CPM simulation

// Soft constraint addition - Attraction point 
let apointcons = new CPM.AttractionPointConstraint( {        
	LAMBDA_ATTRACTIONPOINT : [0, 100, 0],
	ATTRACTIONPOINT: [[0,0], [100, 100], [0, 0]]	
} ) 
sim.C.add (apointcons)                              //adding constraint to the CPM

    meter = new FPSMeter({left:"auto", right:"1400px", top:"90px"}) // intitialize FPS meter + localization on screen
	step()
}


function step(){
    meter.tick()
	// Run IMGFRAMERATE simulation steps before rendering
	for( let s = 0; s < config.simsettings.IMGFRAMERATE; s++ ){
		sim.step()
	}
	requestAnimationFrame(step)
}

<!-- Alternative step function without Framerate changes
function step(){
    sim.step()
    meter.tick()
    if(sim.conf["RUNTIME_BROWSER"]  == "Inf" | sim.time+1 <sim.conf["RUNTIME_BROWSER"]){
        requestAnimationFrame(step)
    }
}
-->

</script>
</head>
<body onload="initialize()">
<h1>Visualization example</h1>
<p>Two celltypes, activity for only one celltype
</p>
</body>
</html>
