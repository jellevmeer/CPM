<!-- Sourcing the cpm build -->
<script src="./Build/artistoo.js"></script>
<script src="./fpsmeter.min.js"></script>
<script>
"use strict"

let config = {

	// Grid settings
	ndim : 2,
	field_size : [150,150],
	
	// CPM parameters and configuration
	conf : {
		T : 20,			// CPM temperature
        seed : 2,
        torus : [true, true],
				
		// Adhesion parameters:
		J: [[0,20], [20,100]] ,
		
		// VolumeConstraint parameters
		LAMBDA_V : [0,50],	// VolumeConstraint importance per cellkind
		V : [0,500],		// Target volume of each cellkind

        // PerimeterConstraint parameters
		LAMBDA_P : [0,2],					// PerimeterConstraint importance per cellkind
		P : [0,145] 						// Target perimeter of each cellkind
	},
	
	// Simulation setup and configuration
	simsettings : {
		// Cells on the grid
		NRCELLS : [1],		// Number of cells to seed for all
					// non-background cellkinds.
		RUNTIME : 500,                // Only used in node
		CANVASCOLOR : "eaecef",
        RUNTIME_BROWSER : "Inf",
        SHOWBORDERS : [true],
        BORDERCOL : ['FF0000'],
		zoom : 4		// zoom in on canvas with this factor.
	}
}


let sim, meter
function initialize() {
    let custommethods = {                           //define object custommethods, contains key : value [Replace initializeGrid by initializeGrid, see new function]
         initializeGrid : initializeGrid          
    }
    sim = new CPM.Simulation(config, custommethods)                 //initialize CPM simulation + add custommethods to override old method

    meter = new FPSMeter({left:"auto", right:"1400px", top:"90px"}) // intitialize FPS meter + localization on screen
	step()
}

function step() {
    sim.step()
    meter.tick()
    if(sim.conf["RUNTIME_BROWSER"]  == "Inf" | sim.time+1 <sim.conf["RUNTIME_BROWSER"]){
        requestAnimationFrame(step)
    }
}



function initializeGrid() {                                          // will be added to the sim object through custommethods, thus this. is required

	// add the initializer if not already there
	if( !this.helpClasses["gm"] ){ this.addGridManipulator() }

	// Seed epidermal cell layer
	let step = 12
	
	for( let i = 1 ; i < this.C.extents[0] ; i += step ){           //extents = size of the grid in each dimension (x-axis is dim[0], y-axis is dim[1])
		for( let j = 1 ; j < this.C.extents[1] ; j += step ){
			this.gm.seedCellAt( 1, [i,j] )                          //seedCellAt(kind: CellKind, p: ArrayCoordinate): CellId
                                                                    //so, Seed a new cell of celltype "kind" onto position "p".
		}
	}
}

</script>
</head>
<body onload="initialize()">
